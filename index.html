<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VEELOURSE | Quietly Different.</title>
<meta name="description" content="VEELOURSE is premium contemporary streetwear. Less products. More identity. Better quality. Discover Drop 001.">
<meta property="og:title" content="VEELOURSE | Quietly Different."><meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--w:#fff;--k:#0a0a0a;--g:#6b6b6b;--l:#e6e6e6;--s:'Cormorant Garamond',Georgia,serif;--n:'Inter Tight',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:90px;height:auto}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
body{background:var(--w);color:var(--k);font:400 15px/1.65 var(--n);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--k);outline-offset:3px}
.wrap{padding:0 clamp(20px,4vw,56px);max-width:1500px;margin:0 auto}
.cap{text-transform:uppercase;letter-spacing:.16em;font-size:11.5px;font-weight:500}
h1,h2,h3{font-family:var(--s);font-weight:400;line-height:1;letter-spacing:-.01em}
h2{font-size:clamp(38px,6.4vw,92px)}
em{font-style:italic}
/* loader */
#ld{position:fixed;inset:0;background:var(--k);color:var(--w);z-index:200;display:grid;place-items:center;transition:opacity .9s ease,visibility .9s}
#ld.off{opacity:0;visibility:hidden}
#ld span{font-family:var(--s);font-size:clamp(28px,5vw,48px);letter-spacing:.34em;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
/* announcement + nav */
.ann{background:var(--k);color:var(--w);text-align:center;padding:9px 16px}
header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);transition:transform .45s ease,border-color .3s;border-bottom:1px solid transparent}
header.sc{border-color:var(--l)}header.hide{transform:translateY(-100%)}
nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:68px}
.logo{font-family:var(--s);font-size:26px;letter-spacing:.3em;font-weight:500;justify-self:start}
.links{display:flex;gap:34px;justify-self:center}
.links a,.ul{position:relative;padding:4px 0}
.links a::after,.ul::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.links a:hover::after,.ul:hover::after{transform:scaleX(1);transform-origin:left}
.right{justify-self:end;display:flex;gap:22px;align-items:center}
#mb{display:none;width:30px;height:20px;position:relative}
#mb i{position:absolute;left:0;width:100%;height:1.5px;background:var(--k);transition:.4s}
#mb i:first-child{top:5px}#mb i:last-child{top:14px}
#mb[aria-expanded=true] i:first-child{top:9px;transform:rotate(45deg)}#mb[aria-expanded=true] i:last-child{top:9px;transform:rotate(-45deg)}
.bag{display:flex;gap:8px;align-items:center}.bag b{font-weight:500}
#mm{position:fixed;inset:0;background:var(--w);z-index:55;display:flex;flex-direction:column;justify-content:center;padding:0 28px;gap:6px;clip-path:inset(0 0 100% 0);transition:clip-path .7s cubic-bezier(.7,0,.2,1);visibility:hidden}
#mm.o{clip-path:inset(0);visibility:visible}
#mm a{font-family:var(--s);font-size:clamp(44px,13vw,72px);line-height:1.15}
@media(max-width:860px){.links{display:none}#mb{display:block;order:2}nav{grid-template-columns:1fr auto}.logo{font-size:21px}}
/* hero */
.ph{position:relative;background:linear-gradient(135deg,#d9d9d9,#f1f1f1 55%,#cfcfcf);overflow:hidden;display:grid;place-items:center;text-align:center;color:#7d7d7d;filter:grayscale(1);width:100%;height:100%}
.ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 22px,rgba(0,0,0,.035) 22px 23px)}
.ph span{position:relative;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:0 20px;line-height:1.8}
.ph.dk{background:linear-gradient(135deg,#1c1c1c,#3a3a3a 55%,#161616);color:#8f8f8f}
.hero{position:relative;height:calc(100svh - 106px);min-height:560px;background:var(--k);color:var(--w)}
.hero .ph{position:absolute;inset:0;animation:zoom 2.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes zoom{from{transform:scale(1.12)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),transparent 55%)}
.hc{position:absolute;z-index:2;left:0;right:0;bottom:clamp(34px,7vh,80px)}
.hero h1{font-size:clamp(54px,12.5vw,200px);letter-spacing:-.025em;line-height:.88}
.hero h1 span{display:block;overflow:hidden}.hero h1 span b{display:block;font-weight:400;transform:translateY(105%);animation:up 1.2s .9s cubic-bezier(.2,.7,.2,1) forwards}
.hero h1 span:nth-child(2) b{animation-delay:1.05s}
@keyframes up{to{transform:none}}
.hrow{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-top:34px;flex-wrap:wrap;opacity:0;animation:fi 1.2s 1.6s forwards}
@keyframes fi{to{opacity:1}}
.hrow p{max-width:340px;font-size:16px}
.btn{display:inline-block;padding:17px 38px;border:1px solid currentColor;transition:.4s;position:relative;overflow:hidden;z-index:0;text-align:center}
.btn::before{content:"";position:absolute;inset:0;background:var(--c,var(--w));transform:translateY(101%);transition:transform .45s cubic-bezier(.2,.7,.2,1);z-index:-1}
.btn:hover::before{transform:none}.btn:hover{color:var(--h,var(--k))}
.btn.s{background:var(--k);color:var(--w);border-color:var(--k);--c:var(--w);--h:var(--k)}
.scr{position:absolute;right:clamp(20px,4vw,56px);bottom:26px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:10px;letter-spacing:.2em;writing-mode:vertical-rl;opacity:0;animation:fi 1s 2s forwards}
.scr i{width:1px;height:46px;background:rgba(255,255,255,.35);position:relative;overflow:hidden}
.scr i::after{content:"";position:absolute;left:0;top:-50%;width:1px;height:50%;background:#fff;animation:sl 1.8s infinite}
@keyframes sl{to{top:110%}}
@media(max-width:700px){.scr{display:none}}
/* sections */
section{padding:clamp(80px,12vw,170px) 0}
.sh{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:clamp(40px,6vw,80px);flex-wrap:wrap}
.sh p{max-width:340px;color:var(--g)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.4vw,36px)}
@media(max-width:860px){.pg{grid-template-columns:1fr}}
.pc .im{position:relative;aspect-ratio:4/5;overflow:hidden;display:block;cursor:pointer;background:#eee}
.pc .im .ph{position:absolute;inset:0;transition:opacity .7s ease,transform 1.3s cubic-bezier(.2,.7,.2,1)}
.pc .im .b{opacity:0}.pc:hover .b{opacity:1}.pc:hover .im .ph{transform:scale(1.05)}
.qv{position:absolute;z-index:2;left:14px;right:14px;bottom:14px;display:flex;gap:8px;transform:translateY(120%);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.pc:hover .qv,.qv:focus-within{transform:none}
@media(hover:none){.qv{transform:none}}
.qv button{flex:1;padding:14px;background:var(--w);color:var(--k);transition:.3s}.qv button:hover{background:var(--k);color:var(--w)}
.pi{display:flex;justify-content:space-between;gap:16px;padding-top:18px}
.pi h3{font-size:30px}.pi p{color:var(--g);font-size:13.5px;margin-top:6px}.pi .pr{color:var(--g);white-space:nowrap;font-size:13px}
.num{font-size:11px;color:var(--g);letter-spacing:.14em}
/* story */
.story{background:var(--k);color:var(--w)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,7vw,120px);align-items:center}
.sg .fr{aspect-ratio:4/5}
.sg p{font-size:clamp(17px,1.5vw,21px);max-width:520px;margin-top:36px;color:#cfcfcf}
@media(max-width:860px){.sg{grid-template-columns:1fr}}
/* philosophy */
.ph3 .r{display:grid;grid-template-columns:90px 1fr 1fr;gap:20px;align-items:baseline;padding:clamp(26px,4vw,50px) 0;border-top:1px solid var(--l)}
.ph3 .r:last-child{border-bottom:1px solid var(--l)}
.ph3 h3{font-size:clamp(34px,5.4vw,78px);transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.ph3 .r:hover h3{transform:translateX(16px)}.ph3 p{color:var(--g);max-width:360px}
@media(max-width:700px){.ph3 .r{grid-template-columns:1fr}}
/* editorial */
.ed{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(14px,2vw,28px);align-items:start}
.ed>div{overflow:hidden}.ed .ph{transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}.ed>div:hover .ph{transform:scale(1.04)}
.e1{grid-column:1/8;aspect-ratio:4/5}.e2{grid-column:9/13;aspect-ratio:3/4;margin-top:20%}
.e3{grid-column:2/6;aspect-ratio:1;margin-top:-6%}.et{grid-column:7/13;align-self:center}
.et p{font-family:var(--s);font-size:clamp(26px,3.2vw,46px);line-height:1.15}
.e4{grid-column:4/13;aspect-ratio:16/8}
@media(max-width:760px){.e1,.e2,.e3,.et,.e4{grid-column:1/-1;margin-top:0}.e2{grid-column:4/13}.e3{grid-column:1/9}}
/* news */
.nw{text-align:center;background:#f4f4f4}
.nw form{display:flex;max-width:560px;margin:46px auto 0;border-bottom:1px solid var(--k)}
.nw input{flex:1;min-width:0;background:none;border:0;padding:16px 0;outline:0}
.nw form:focus-within{border-bottom-width:2px}
.nw form button{padding:0 6px}
.nw p.m{margin-top:16px;min-height:24px;color:var(--g);font-size:13px}
/* footer */
footer{padding:90px 0 34px}
.fw{font-family:var(--s);font-size:clamp(54px,15.4vw,260px);letter-spacing:.06em;line-height:.9;margin-bottom:70px;white-space:nowrap}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:34px}
footer h4{font-weight:500;margin-bottom:16px}footer li{list-style:none;margin-bottom:9px;color:var(--g)}footer li a:hover,footer li button:hover{color:var(--k)}
.fb{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:60px;padding-top:24px;border-top:1px solid var(--l);color:var(--g);font-size:12.5px}
@media(max-width:760px){.fg{grid-template-columns:1fr 1fr}}
/* product page */
.pp{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(26px,5vw,80px);padding:30px 0 120px;align-items:start}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:14px}.gal>div:first-child{grid-column:1/-1;aspect-ratio:4/5}.gal>div{aspect-ratio:3/4}
.pd{position:sticky;top:96px}
.pd h1{font-size:clamp(44px,6vw,84px);margin:14px 0 10px}
.pd .cat{color:var(--g)}.pd .desc{margin:28px 0;max-width:440px}
.crumb{padding:26px 0 0;color:var(--g)}
.sz{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 26px}
.sz button{min-width:54px;padding:12px 0;border:1px solid var(--l);transition:.3s}
.sz button:hover{border-color:var(--k)}.sz button[aria-pressed=true]{background:var(--k);color:var(--w);border-color:var(--k)}
.note{color:var(--g);font-size:12.5px;margin-top:18px}
.acc{border-top:1px solid var(--l);margin-top:34px}.acc details{border-bottom:1px solid var(--l);padding:16px 0}
.acc summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between}.acc summary::after{content:"+"}.acc details[open] summary::after{content:"–"}
.acc details p{margin-top:12px;color:var(--g)}
@media(max-width:860px){.pp{grid-template-columns:1fr}.pd{position:static}}
.info{padding:clamp(60px,10vw,140px) 0 140px;max-width:760px}.info p{margin-top:26px;color:var(--g)}
/* drawer + modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;opacity:0;visibility:hidden;transition:.5s}.ov.o{opacity:1;visibility:visible}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--w);z-index:95;transform:translateX(100%);transition:transform .6s cubic-bezier(.7,0,.2,1);display:flex;flex-direction:column;padding:26px;padding-bottom:calc(26px + env(safe-area-inset-bottom,0px))}
#dr.o{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--l)}
#ci{flex:1;overflow:auto;padding:10px 0}.empty{color:var(--g);padding:40px 0}
.li{display:grid;grid-template-columns:84px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--l)}
.li .t{aspect-ratio:4/5}.li h4{font-family:var(--s);font-size:22px;font-weight:400}.li small{color:var(--g);display:block}
.qt{display:inline-flex;border:1px solid var(--l);margin-top:10px;align-items:center}.qt button{width:36px;height:34px}.qt span{min-width:30px;text-align:center}
.rm{margin-left:14px;color:var(--g);font-size:12.5px;text-decoration:underline}
.df{padding-top:20px;border-top:1px solid var(--l)}.df .tt{display:flex;justify-content:space-between;margin-bottom:16px}.df .btn{width:100%}
#qvm{position:fixed;z-index:96;left:50%;top:50%;transform:translate(-50%,-46%);width:min(900px,92vw);max-height:90vh;overflow:auto;background:var(--w);display:grid;grid-template-columns:1fr 1fr;opacity:0;visibility:hidden;transition:.5s}
#qvm.o{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
#qvm .q{aspect-ratio:4/5}#qvm .d{padding:clamp(24px,4vw,48px);position:relative}
#qvm h3{font-size:44px;margin:10px 0}.x{position:absolute;right:16px;top:12px;font-size:26px;width:40px;height:40px}
@media(max-width:700px){#qvm{grid-template-columns:1fr}#qvm .q{aspect-ratio:16/10}}
#tt{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,200%);background:var(--k);color:var(--w);padding:14px 26px;z-index:150;transition:transform .5s cubic-bezier(.2,.7,.2,1);max-width:92vw;text-align:center}
#tt.o{transform:translate(-50%,0)}
/* cursor + reveal + page fade */
#cu{position:fixed;left:0;top:0;width:12px;height:12px;border-radius:50%;background:#fff;mix-blend-mode:difference;pointer-events:none;z-index:300;transition:width .3s,height .3s,margin .3s;opacity:0}
#cu.h{width:54px;height:54px;margin:-21px 0 0 -21px}
@media(hover:none),(pointer:coarse){#cu{display:none}}
.rv{opacity:0;transform:translateY(34px);transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
#app{transition:opacity .35s ease}#app.f{opacity:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.rv{opacity:1;transform:none}.hero h1 span b,.hrow,.scr{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="ld" aria-hidden="true"><span>VEELOURSE</span></div>
<div class="ann cap">Introducing VEELOURSE — Drop 001</div>
<header id="hd"><div class="wrap"><nav aria-label="Main">
 <a class="logo" href="#top" aria-label="VEELOURSE home">VEELOURSE</a>
 <div class="links cap"><a href="#drop">Shop</a><a href="#editorial">Collection</a><a href="#story">Our Story</a><a href="#contact">Contact</a></div>
 <div class="right"><button class="bag cap" id="bagb" aria-label="Open shopping bag">Bag <b id="cnt">0</b></button><button id="mb" aria-label="Menu" aria-expanded="false" aria-controls="mm"><i></i><i></i></button></div>
</nav></div></header>
<div id="mm" aria-hidden="true"><a href="#drop">Shop</a><a href="#editorial">Collection</a><a href="#story">Our Story</a><a href="#contact">Contact</a></div>
<main id="app"></main>

<div class="ov" id="ov"></div>
<aside id="dr" aria-label="Shopping bag" aria-hidden="true"><div class="dh"><h3 style="font-size:32px">Your bag</h3><button class="cap ul" id="dx">Close</button></div><div id="ci"></div>
 <div class="df"><div class="tt"><span>Subtotal</span><span id="sub">Shown once prices are added</span></div><button class="btn s cap" id="co">Checkout</button><p class="note">Shipping and taxes are calculated at checkout.</p></div></aside>
<div id="qvm" role="dialog" aria-modal="true" aria-label="Quick view"></div>
<div id="tt" role="status"></div>
<div id="cu"></div>

<script>
/* ===== INTEGRATION POINTS =====
 price: null until supplied (number in INR). sizes/stock: replace with inventory API.
 checkout: connect a payment provider (Razorpay, Stripe, Shopify Storefront API) here. */
const CONFIG={currency:'INR',email:'hello@veelourse.com (placeholder)',instagram:'Instagram handle to be added',checkout:null};
const PRODUCTS=[
{id:'built-not-bought',n:'Built Not Bought',c:'Black Racing Oversized Hoodie',d:'A bold motorsport-inspired statement piece with a distinctive racing graphic.',f:'Washed black, oversized silhouette, premium streetwear aesthetic.',price:null,sizes:['S','M','L','XL'],dk:1},
{id:'olive-signature',n:'Olive Signature',c:'Olive Green Oversized Hoodie',d:'A refined everyday essential with a distinctive premium identity.',f:'Olive green, clean and sophisticated branding.',price:null,sizes:['S','M','L','XL']},
{id:'everyday-form',n:'Everyday Form',c:'Yellowish Khaki Baggy Lower',d:'A relaxed silhouette designed for effortless everyday styling.',f:'Yellowish khaki tone, premium baggy fit, minimal branding.',price:null,sizes:['S','M','L','XL']}];
const $=s=>document.querySelector(s),app=$('#app');let cart=[],view='',tt;
const money=p=>p==null?'Price to be announced':new Intl.NumberFormat('en-IN',{style:'currency',currency:CONFIG.currency,maximumFractionDigits:0}).format(p);
const ph=(l,dk,s)=>`<div class="ph ${dk?'dk':''} ${s||''}" role="img" aria-label="Image placeholder: ${l}"><span>Replace image<br>${l}</span></div>`;
function toast(m){const t=$('#tt');t.textContent=m;t.classList.add('o');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('o'),2800)}
const card=(p,i)=>`<article class="pc rv"><div class="im" data-qv="${p.id}" tabindex="0" role="button" aria-label="Quick view ${p.n}">${ph(p.id+'-front.jpg',p.dk)}${ph(p.id+'-back.jpg',!p.dk,'b')}
<div class="qv"><button class="cap" data-qvb="${p.id}">Quick view</button><button class="cap" data-quick="${p.id}">Add to bag</button></div></div>
<div class="pi"><div><span class="num">0${i+1}</span><h3><a class="ul" href="#product-${p.id}">${p.n}</a></h3><p>${p.c}</p></div><span class="pr">${money(p.price)}</span></div></article>`;
function home(){return`<div id="top" class="hero">${ph('hero-campaign.jpg — full-screen editorial, black and white',1)}
<div class="hc wrap"><h1 aria-label="Quietly different."><span><b>QUIETLY</b></span><span><b>DIFFERENT.</b></span></h1>
<div class="hrow"><p>A different perspective on everyday streetwear.</p><a class="btn cap" href="#drop">Explore Drop 001</a></div></div><div class="scr cap">Scroll<i></i></div></div>
<section id="drop"><div class="wrap"><div class="sh rv"><h2>Drop 001</h2><p>Three pieces. Each one made with intention. Nothing more.</p></div><div class="pg">${PRODUCTS.map(card).join('')}</div></div></section>
<section class="story" id="story"><div class="wrap sg"><div class="fr rv">${ph('story-editorial.jpg',1)}</div><div class="rv"><span class="cap" style="color:#999">Our Story</span><h2 style="margin-top:22px">MORE THAN WHAT <em>you wear.</em></h2><p>VEELOURSE represents a different perspective on everyday style. Built around thoughtful design, distinctive identity and uncompromising attention to detail. We believe in creating less, but creating better.</p></div></div></section>
<section class="ph3"><div class="wrap"><div class="sh rv"><span class="cap">Philosophy</span><p>Less Products. More Identity. Better Quality.</p></div>
${[['LESS, BUT BETTER.','We release few pieces so each one can be perfected.'],['BUILT WITH INTENTION.','Every cut, stitch and graphic is decided, never defaulted.'],['QUIETLY DIFFERENT.','Identity that doesn’t shout. You notice it when you look closer.']].map((x,i)=>`<div class="r rv"><span class="num">0${i+1}</span><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></section>
<section id="editorial" style="padding-top:0"><div class="wrap"><div class="sh rv"><h2>The <em>campaign</em></h2></div><div class="ed">
<div class="e1 rv">${ph('campaign-01.jpg',1)}</div><div class="e2 rv">${ph('campaign-02.jpg')}</div>
<div class="e3 rv">${ph('campaign-03.jpg')}</div><div class="et rv"><p>Shot in black and white. Cut for movement. Made to be lived in, every day.</p></div>
<div class="e4 rv">${ph('campaign-04-wide.jpg',1)}</div></div></div></section>
<section class="nw"><div class="wrap rv"><h2>BE PART OF THE <em>difference.</em></h2><p style="margin-top:22px;color:var(--g)">Discover new drops, stories and everything VEELOURSE.</p>
<form id="nf" novalidate><input id="em" type="email" placeholder="Your email address" aria-label="Email address" autocomplete="email"><button class="cap ul" type="submit">Subscribe</button></form><p class="m" id="nm" role="status"></p></div></section>`}
function product(id){const p=PRODUCTS.find(x=>x.id===id);if(!p)return info('Not found','This product doesn’t exist. Return to Drop 001 to see all pieces.');
return`<div class="wrap"><p class="crumb cap"><a class="ul" href="#drop">Drop 001</a> / ${p.n}</p><div class="pp"><div class="gal">${ph(p.id+'-01.jpg',p.dk)}${ph(p.id+'-02.jpg',!p.dk)}${ph(p.id+'-detail.jpg')}</div>
<div class="pd"><span class="cap cat">${p.c}</span><h1>${p.n}</h1><p class="pr">${money(p.price)}</p><p class="desc">${p.d}<br><br>${p.f}</p>
<span class="cap">Size</span><div class="sz" id="sz">${p.sizes.map((s,i)=>`<button aria-pressed="${i==1}" data-s="${s}">${s}</button>`).join('')}</div>
<button class="btn s cap" style="width:100%" data-add="${p.id}">Add to bag</button><p class="note">Sizes and stock are placeholders until inventory is connected.</p>
<div class="acc"><details><summary class="cap">Details</summary><p>${p.f} Fabric and care details to be supplied.</p></details><details><summary class="cap">Shipping and returns</summary><p>Policy details to be supplied. See the policy pages in the footer.</p></details></div></div></div></div>`}
function info(t,b){return`<div class="wrap info"><span class="cap" style="color:var(--g)">VEELOURSE</span><h1 style="font-size:clamp(44px,7vw,100px);margin-top:18px">${t}</h1><p>${b}</p><p><a class="btn cap" style="--c:var(--k);--h:var(--w)" href="#top">Back to home</a></p></div>`}
const INFO={shipping:['Shipping Policy','Our shipping policy will be published here before launch. Delivery times, rates and regions will be confirmed once the shipping partner is connected.'],returns:['Return &amp; Exchange Policy','Our return and exchange terms will be published here before launch.'],privacy:['Privacy Policy','Our privacy policy will be published here before launch.'],terms:['Terms &amp; Conditions','Our terms and conditions will be published here before launch.'],contact:['Contact','Reach us at '+CONFIG.email+'. '+CONFIG.instagram+'.']};
const foot=`<footer id="contact"><div class="wrap"><div class="fw" aria-hidden="true">VEELOURSE</div><div class="fg"><div><h4 class="cap">Quietly different.</h4><p style="color:var(--g);max-width:280px">Premium contemporary streetwear. Less products. More identity. Better quality.</p></div>
<div><h4 class="cap">Explore</h4><ul><li><a href="#drop">Shop</a></li><li><a href="#story">Our Story</a></li><li><a href="#info-contact">Contact</a></li><li><a href="#info-instagram">Instagram</a></li></ul></div>
<div><h4 class="cap">Policies</h4><ul><li><a href="#info-shipping">Shipping Policy</a></li><li><a href="#info-returns">Return &amp; Exchange Policy</a></li><li><a href="#info-privacy">Privacy Policy</a></li><li><a href="#info-terms">Terms &amp; Conditions</a></li></ul></div>
<div><h4 class="cap">Contact</h4><ul><li>${CONFIG.email}</li></ul></div></div><div class="fb"><span>© 2026 VEELOURSE. All rights reserved.</span><a class="ul" href="#top">Back to top</a></div></div></footer>`;
INFO.instagram=['Instagram','The VEELOURSE Instagram link will be added here once the account handle is supplied.'];
/* routing */
function route(){const h=location.hash.slice(1);let v='home';if(h.startsWith('product-'))v=h;else if(h.startsWith('info-'))v=h;
const go=()=>{if(v!==view){view=v;let html;if(v==='home')html=home();else if(v.startsWith('product-'))html=product(v.slice(8));else{const k=INFO[v.slice(5)]||['Not found','This page doesn’t exist.'];html=info(k[0],k[1])}
app.innerHTML=html+foot;scrollTo(0,0);watch()}
if(v==='home'&&h&&h!=='top'){const e=document.getElementById(h);if(e)setTimeout(()=>e.scrollIntoView({behavior:'smooth'}),60)}
document.title=v.startsWith('product-')?(PRODUCTS.find(x=>'product-'+x.id===v)||{n:'Not found'}).n+' | VEELOURSE':'VEELOURSE | Quietly Different.';
app.classList.remove('f');closeMenu()};
if(view&&v!==view){app.classList.add('f');setTimeout(go,350)}else go()}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
function watch(){document.querySelectorAll('.rv').forEach(e=>io.observe(e))}
/* cart */
const count=()=>cart.reduce((a,b)=>a+b.q,0);
function draw(){$('#cnt').textContent=count();$('#ci').innerHTML=cart.length?cart.map((l,i)=>{const p=PRODUCTS.find(x=>x.id===l.id);return`<div class="li"><div class="t">${ph(p.id+'.jpg',p.dk)}</div><div><h4>${p.n}</h4><small>${p.c}</small><small>Size ${l.s} · ${money(p.price)}</small><div class="qt"><button data-q="${i}" data-d="-1" aria-label="Decrease quantity">−</button><span>${l.q}</span><button data-q="${i}" data-d="1" aria-label="Increase quantity">+</button></div><button class="rm" data-r="${i}">Remove</button></div></div>`}).join(''):'<p class="empty">Your bag is empty. Explore Drop 001 to add a piece.</p>';
const priced=cart.length&&cart.every(l=>PRODUCTS.find(x=>x.id===l.id).price!=null);$('#sub').textContent=priced?money(cart.reduce((a,l)=>a+l.q*PRODUCTS.find(x=>x.id===l.id).price,0)):'Shown once prices are added'}
function add(id,s){const p=PRODUCTS.find(x=>x.id===id),l=cart.find(x=>x.id===id&&x.s===s);l?l.q++:cart.push({id,s,q:1});draw();toast(p.n+' ('+s+') added to your bag')}
function drawer(o){$('#dr').classList.toggle('o',o);$('#ov').classList.toggle('o',o||$('#qvm').classList.contains('o'));$('#dr').setAttribute('aria-hidden',!o)}
function qv(id){const p=PRODUCTS.find(x=>x.id===id);$('#qvm').innerHTML=`<div class="q">${ph(id+'-front.jpg',p.dk)}</div><div class="d"><button class="x" data-cl aria-label="Close quick view">×</button><span class="cap" style="color:var(--g)">${p.c}</span><h3>${p.n}</h3><p style="color:var(--g)">${money(p.price)}</p><p style="margin:20px 0">${p.d}</p><span class="cap">Size</span><div class="sz" id="qs">${p.sizes.map((s,i)=>`<button aria-pressed="${i==1}" data-s="${s}">${s}</button>`).join('')}</div><button class="btn s cap" style="width:100%" data-addq="${id}">Add to bag</button><p style="margin-top:18px"><a class="ul cap" href="#product-${id}" data-cl>View full details</a></p></div>`;$('#qvm').classList.add('o');$('#ov').classList.add('o')}
function closeQ(){$('#qvm').classList.remove('o');if(!$('#dr').classList.contains('o'))$('#ov').classList.remove('o')}
const selSize=r=>(r.querySelector('[aria-pressed=true]')||{}).dataset.s;
document.addEventListener('click',e=>{const t=e.target,c=s=>t.closest(s);
let b;
if(b=c('[data-quick]'))return e.stopPropagation(),add(b.dataset.quick,'M');
if(b=c('[data-qvb]'))return qv(b.dataset.qvb);
if(b=c('[data-qv]')){if(!c('.qv'))qv(b.dataset.qv);return}
if(b=c('[data-addq]')){add(b.dataset.addq,selSize($('#qs')));closeQ();drawer(true);return}
if(b=c('[data-add]')){add(b.dataset.add,selSize($('#sz')));drawer(true);return}
if(b=c('.sz button')){b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
if(c('[data-cl]'))return closeQ();
if(c('#bagb'))return drawer(true);if(c('#dx')||c('#ov')){drawer(false);closeQ();return}
if(b=c('[data-q]')){const l=cart[b.dataset.q];l.q+=+b.dataset.d;if(l.q<1)cart.splice(b.dataset.q,1);return draw()}
if(b=c('[data-r]')){cart.splice(b.dataset.r,1);return draw()}
if(c('#co'))return toast(cart.length?'Checkout isn’t connected yet. A payment provider needs to be added.':'Your bag is empty.');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){drawer(false);closeQ();closeMenu()}if(e.key==='Enter'&&e.target.matches('[data-qv]'))qv(e.target.dataset.qv)});
document.addEventListener('submit',e=>{if(e.target.id!=='nf')return;e.preventDefault();const v=$('#em').value.trim();$('#nm').textContent=/^\S+@\S+\.\S+$/.test(v)?'Newsletter signup isn’t connected yet, so your email was not saved.':'Please enter a valid email address.'});
/* menu, scroll, cursor */
function closeMenu(){$('#mm').classList.remove('o');$('#mb').setAttribute('aria-expanded','false');$('#mm').setAttribute('aria-hidden','true')}
$('#mb').onclick=()=>{const o=$('#mm').classList.toggle('o');$('#mb').setAttribute('aria-expanded',o);$('#mm').setAttribute('aria-hidden',!o)};
$('#mm').onclick=e=>{if(e.target.tagName==='A')closeMenu()};
let ly=0;addEventListener('scroll',()=>{const y=scrollY,h=$('#hd');h.classList.toggle('sc',y>20);h.classList.toggle('hide',y>ly&&y>300);ly=y},{passive:true});
const cu=$('#cu');addEventListener('mousemove',e=>{cu.style.opacity=1;cu.style.transform=`translate(${e.clientX-6}px,${e.clientY-6}px)`;cu.classList.toggle('h',!!e.target.closest('a,button,[data-qv]'))});
addEventListener('hashchange',route);
draw();route();addEventListener('load',()=>setTimeout(()=>$('#ld').classList.add('off'),900));
setTimeout(()=>$('#ld').classList.add('off'),2200);
</script>
</body>
</html>
